plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url = uri("https://frcmaven.wpi.edu/artifactory/release/") }
}

dependencies {
    compileOnly "edu.wpi.first.wpilibj:wpilibj-java:2026.2.1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "LARS-WPILib"
                description = "Official WPILib library for Pennington Laboratories LARS."
                url = "https://github.com/pennington-laboratories/LARS-WPILib"
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
            }
        }
    }
}
